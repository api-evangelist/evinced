aid: evinced
name: evinced
description: >-
  Evinced is an AI-powered digital accessibility platform that automatically
  detects, clusters, tracks, and prevents accessibility (WCAG/ADA) issues across
  web and mobile applications. It ships developer-first automation SDKs for
  Selenium, Cypress, Playwright, WebdriverIO, TestCafe, Appium, Espresso, and
  XCUITest, plus Web and Mobile Model Context Protocol (MCP) servers that let AI
  coding agents (Cursor, Claude, VS Code, Continue) query accessibility advice
  and run automated remediation in-flow. Backed by Insight Partners, Evinced is
  used by Amazon, Capital One, Verizon, and Hyundai.
